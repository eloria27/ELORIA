name: Build ELORIA APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create ELORIA Project
        run: |
          mkdir -p app/src/main/java/com/eloria/app app/src/main/res/values app/src/main/res/layout .github/workflows
          echo "rootProject.name='ELORIA'
          include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.2' apply false
          id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }" > build.gradle
          echo "org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.eloria.app'; compileSdk 34
          defaultConfig { applicationId "com.eloria.app"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
          buildTypes { release { minifyEnabled false } }
          compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          kotlinOptions { jvmTarget='17' } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="ELORIA" android:theme="@style/Theme.ELORIA"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/eloria/app/MainActivity.kt <<'EOF'
          package com.eloria.app
          import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import android.widget.*
          class MainActivity: AppCompatActivity(){ override fun onCreate(b: Bundle?){ super.onCreate(b); val t=TextView(this); t.text="ELORIA\nFashion Shopping"; t.textSize=32f; t.gravity=17; setContentView(t) } }
          EOF
          echo '<resources><style name="Theme.ELORIA" parent="Theme.MaterialComponents.DayNight.DarkActionBar"/></resources>' > app/src/main/res/values/themes.xml
      - name: Build APK
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ELORIA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
